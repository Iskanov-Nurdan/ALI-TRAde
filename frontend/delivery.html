<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Карточка рейса — ALI trade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="assets/logo.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/config.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="app-sidebar">
        <a class="sidebar__brand" href="dashboard.html">
          <span class="sidebar__mark" id="app-logo" data-icon="truck" data-icon-size="16"></span>
          <span class="sidebar__title" id="app-name">ALI trade</span>
        </a>

        <nav class="sidebar__nav" aria-label="Основная навигация">
          <div class="sidebar__section">Работа</div>
          <a class="sidebar__link" href="dashboard.html" data-icon="dashboard" data-icon-size="17"><span>Панель</span></a>
          <a class="sidebar__link" href="deliveries.html" data-icon="truck" data-icon-size="17" aria-current="page"><span>Рейсы</span></a>
          <a class="sidebar__link" href="sheet.html" data-icon="grid" data-icon-size="17"><span>Таблица</span></a>
          <a class="sidebar__link" href="expenses.html" data-icon="receipt" data-icon-size="17"><span>Расходы</span></a>
          <a class="sidebar__link" href="rates.html" data-icon="coins" data-icon-size="17"><span>Курсы валют</span></a>
          <div class="sidebar__admin">
            <div class="sidebar__section">Администрирование</div>
            <a class="sidebar__link" href="reports.html" data-icon="chart" data-icon-size="17"><span>Отчёты</span></a>
            <a class="sidebar__link" href="points.html" data-icon="pin" data-icon-size="17"><span>Точки</span></a>
            <a class="sidebar__link" href="users.html" data-icon="users" data-icon-size="17"><span>Сотрудники</span></a>
            <a class="sidebar__link" href="settings.html" data-icon="sliders" data-icon-size="17"><span>Справочники</span></a>
            <a class="sidebar__link" href="audit.html" data-icon="history" data-icon-size="17"><span>Журнал действий</span></a>
          </div>
        </nav>

        <div class="sidebar__footer">
          <div class="sidebar__user">
            <span class="sidebar__user-name" id="sidebar-user-name"></span>
            <span class="sidebar__user-role" id="sidebar-user-role"></span>
          </div>
          <button class="sidebar__logout" type="button" id="sidebar-logout" data-icon="logout" data-icon-size="15">
            <span>Выйти</span>
          </button>
        </div>
      </aside>

      <div class="app-body">
        <header class="topbar" id="app-header"></header>

        <main class="app-main">
      <div class="page-header">
        <div>
          <h1 id="page-title">Рейс</h1>
        </div>
        <div class="btn-group" id="actions"></div>
      </div>

      <div id="delivery-root"></div>
        </main>
      </div>
    </div>

    <div class="modal" id="expense-modal" role="dialog" aria-modal="true" aria-labelledby="expense-modal-title" hidden>
      <div class="modal__dialog">
        <div class="modal__header">
          <h2 id="expense-modal-title">Добавить расход</h2>
          <button class="btn btn--sm btn--icon" type="button" data-close aria-label="Закрыть" data-icon="close"></button>
        </div>
        <form id="expense-form" novalidate>
          <div class="form-grid form-grid--2">
            <div class="field">
              <label class="field__label" for="e-type">Тип расхода *</label>
              <select id="e-type" name="expense_type_id" required></select>
            </div>
            <div class="field">
              <label class="field__label" for="e-amount">Сумма *</label>
              <input id="e-amount" name="amount" type="number" min="0.01" step="0.01" required />
            </div>
            <div class="field">
              <label class="field__label" for="e-currency">Валюта *</label>
              <select id="e-currency" name="currency" required></select>
            </div>
            <div class="field">
              <label class="field__label" for="e-payer">Плательщик</label>
              <select id="e-payer" name="payer"></select>
              <span class="field__hint" id="payer-hint"></span>
            </div>
            <div class="field field--span-2">
              <label class="field__label" for="e-description">Описание расхода *</label>
              <input id="e-description" name="description" type="text" placeholder="Осевой — превышение нагрузки" required />
            </div>
            <div class="field field--span-2">
              <label class="field__label" for="e-comment">Комментарий</label>
              <textarea id="e-comment" name="comment" rows="2"></textarea>
            </div>
          </div>
          <div class="modal__footer">
            <button class="btn" type="button" data-close>Отмена</button>
            <button class="btn btn--primary" type="submit" id="expense-submit">Сохранить расход</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal" id="action-modal" role="dialog" aria-modal="true" aria-labelledby="action-modal-title" hidden>
      <div class="modal__dialog">
        <div class="modal__header">
          <h2 id="action-modal-title">Подтверждение</h2>
          <button class="btn btn--sm btn--icon" type="button" data-close aria-label="Закрыть" data-icon="close"></button>
        </div>
        <form id="action-form" novalidate>
          <div class="form-grid">
            <div class="field" id="action-time-field">
              <label class="field__label" for="a-time">Время</label>
              <input id="a-time" name="time" type="datetime-local" />
            </div>
            <div class="field">
              <label class="field__label" for="a-comment">Комментарий</label>
              <textarea id="a-comment" name="comment" rows="2"></textarea>
            </div>
          </div>
          <div class="modal__footer">
            <button class="btn" type="button" data-close>Отмена</button>
            <button class="btn btn--primary" type="submit" id="action-submit">Подтвердить</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="js/pages/delivery.js"></script>
  </body>
</html>
