name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Проверка бэкенда
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: delivery_test
          POSTGRES_USER: delivery
          POSTGRES_PASSWORD: delivery
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U delivery"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: delivery_test
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Установка зависимостей
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Линтер
        working-directory: backend
        run: ruff check apps config

      - name: Проверка конфигурации и миграций
        working-directory: backend
        run: |
          python manage.py check --deploy --fail-level ERROR
          python manage.py makemigrations --check --dry-run

      - name: Тесты
        working-directory: backend
        run: python manage.py test apps --verbosity 2

  frontend:
    name: Проверка фронтенда
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Синтаксис JS-модулей
        run: |
          set -e
          for file in $(find frontend/js -name "*.js"); do
            cp "$file" "/tmp/$(basename "$file").mjs"
            node --check "/tmp/$(basename "$file").mjs"
          done

  build:
    name: Сборка образа
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Сборка Docker-образа
        run: docker build -f backend/Dockerfile -t delivery-api:${{ github.sha }} .
