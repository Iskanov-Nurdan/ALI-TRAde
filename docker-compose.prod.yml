# Боевой контур для домена alitrade.tw1.ru.
# Запуск: docker compose -f docker-compose.prod.yml up -d --build
# Имя проекта задано явно: имя папки с кириллицей Compose использовать не может.
name: delivery-tracker

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery}
      POSTGRES_USER: ${POSTGRES_USER:-delivery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delivery} -d ${POSTGRES_DB:-delivery}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery}
      POSTGRES_USER: ${POSTGRES_USER:-delivery}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --timeout 60 --access-logfile -"
    volumes:
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN обязателен, например alitrade.tw1.ru}
      # Подставлять в шаблоне только ${DOMAIN}, не трогая переменные nginx ($host и т.п.)
      NGINX_ENVSUBST_FILTER: "DOMAIN"
    volumes:
      # Шаблон выбирается переменной NGINX_CONF: http (до выпуска сертификата) или https
      - ./nginx/templates/${NGINX_CONF:-http}.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/app_locations.conf:/etc/nginx/app_locations.conf:ro
      - ./nginx/admin_access.conf:/etc/nginx/admin_access.conf:ro
      - ./nginx/proxy_params_custom.conf:/etc/nginx/proxy_params_custom.conf:ro
      - ./nginx/99-reload-loop.sh:/docker-entrypoint.d/99-reload-loop.sh:ro
      - ./frontend:/usr/share/nginx/html:ro
      - static_files:/usr/share/nginx/static:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_started
    healthcheck:
      # busybox wget не знает --max-redirect, поэтому /health/ отдаётся по HTTP
      # в обоих режимах — и редирект на HTTPS его не перехватывает.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - backend

  # Разовый выпуск сертификата: запускается скриптом deploy.sh, а не при up.
  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "certbot"

  # Автопродление: раз в 12 часов проверяет срок, nginx сам перечитывает конфиг.
  certbot-renew:
    image: certbot/certbot:latest
    restart: unless-stopped
    profiles: ["ssl"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

volumes:
  postgres_data:
  static_files:

networks:
  backend:
    driver: bridge
