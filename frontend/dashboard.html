<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Панель — ALI trade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="assets/logo.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/config.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="app-sidebar">
        <a class="sidebar__brand" href="dashboard.html">
          <span class="sidebar__mark" id="app-logo" data-icon="truck" data-icon-size="16"></span>
          <span class="sidebar__title" id="app-name">ALI trade</span>
        </a>

        <nav class="sidebar__nav" aria-label="Основная навигация">
          <div class="sidebar__section">Работа</div>
          <a class="sidebar__link" href="dashboard.html" data-icon="dashboard" data-icon-size="17" aria-current="page"><span>Панель</span></a>
          <a class="sidebar__link" href="deliveries.html" data-icon="truck" data-icon-size="17"><span>Рейсы</span></a>
          <a class="sidebar__link" href="sheet.html" data-icon="grid" data-icon-size="17"><span>Таблица</span></a>
          <a class="sidebar__link" href="expenses.html" data-icon="receipt" data-icon-size="17"><span>Расходы</span></a>
          <a class="sidebar__link" href="rates.html" data-icon="coins" data-icon-size="17"><span>Курсы валют</span></a>
          <div class="sidebar__admin">
            <div class="sidebar__section">Администрирование</div>
            <a class="sidebar__link" href="reports.html" data-icon="chart" data-icon-size="17"><span>Отчёты</span></a>
            <a class="sidebar__link" href="points.html" data-icon="pin" data-icon-size="17"><span>Точки</span></a>
            <a class="sidebar__link" href="users.html" data-icon="users" data-icon-size="17"><span>Сотрудники</span></a>
            <a class="sidebar__link" href="settings.html" data-icon="sliders" data-icon-size="17"><span>Справочники</span></a>
            <a class="sidebar__link" href="audit.html" data-icon="history" data-icon-size="17"><span>Журнал действий</span></a>
          </div>
        </nav>

        <div class="sidebar__footer">
          <div class="sidebar__user">
            <span class="sidebar__user-name" id="sidebar-user-name"></span>
            <span class="sidebar__user-role" id="sidebar-user-role"></span>
          </div>
          <button class="sidebar__logout" type="button" id="sidebar-logout" data-icon="logout" data-icon-size="15">
            <span>Выйти</span>
          </button>
        </div>
      </aside>

      <div class="app-body">
        <header class="topbar" id="app-header"></header>

        <main class="app-main">
      <div class="page-header">
        <div>
          <h1>Панель</h1>
        </div>
        <div class="btn-group">
          <a class="btn btn--primary btn--cta" href="deliveries.html?new=1"><span>Новый рейс</span></a>
          <a class="btn" href="deliveries.html?state=overdue">Просроченные</a>
        </div>
      </div>

      <section aria-labelledby="stats-title">
        <h2 id="stats-title" class="visually-hidden">Сводные показатели</h2>
        <div class="stats" id="stats"></div>
      </section>

      <section class="card" aria-labelledby="active-title">
        <div class="card__title">
          <h2 id="active-title">Машины в пути и просроченные</h2>
          <span class="legend">
            <span class="legend__item"><span class="legend__swatch legend__swatch--normal"></span> обычный</span>
            <span class="legend__item"><span class="legend__swatch legend__swatch--orange"></span> есть расход</span>
            <span class="legend__item"><span class="legend__swatch legend__swatch--red"></span> просрочен</span>
          </span>
          <a class="btn btn--sm" href="deliveries.html?state=active">Все рейсы</a>
        </div>
        <div id="active-deliveries"></div>
      </section>

      <section class="card" aria-labelledby="recent-title">
        <div class="card__title">
          <h2 id="recent-title">Последние прибытия</h2>
        </div>
        <div id="recent-deliveries"></div>
      </section>
        </main>
      </div>
    </div>

    <script type="module" src="js/pages/dashboard.js"></script>
  </body>
</html>
